apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-external-secret     # Must be in the memos namespace so the Secret is created where the pods can access it
  namespace: memos
spec: 
  refreshInterval: 1h             # ESO checks Secrets Manager every hour and syncs any changes automatically
  secretStoreRef:
    name: aws-secretsmanager      # References the ClusterSecretStore that defines the AWS Secrets Manager connection
    kind: ClusterSecretStore
  target:
    name: memos-secret            # Name of the Kubernetes Secret ESO will create — must match secretKeyRef in deployment.yaml
    creationPolicy: Owner         # ESO owns this Secret — if ExternalSecret is deleted, the Kubernetes Secret is also deleted
  data:
  - secretKey: MEMOS_DSN          # Key inside the Kubernetes Secret — matches env var in deployment
    remoteRef:
      key: memos-dsn              # Name of the secret in AWS Secrets Manager