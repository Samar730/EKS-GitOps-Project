name: Terraform Destroy

on:
  workflow_dispatch:

# Runner Preparations
permissions:
  id-token: write 
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform Plugins
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"

      - name: Terraform Init
        run: terraform init

      - name: Get Secret Credentials from Secrets Manager (DB + Admin)
        run: |
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id memos-db-password \
            --query SecretString \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "TF_VAR_db_password=$DB_PASSWORD" >> $GITHUB_ENV

          DB_USERNAME=$(aws secretsmanager get-secret-value \
            --secret-id memos-db-username \
            --query SecretString \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "TF_VAR_db_username=$DB_USERNAME" >> $GITHUB_ENV

          ADMIN_IAM_ARN=$(aws secretsmanager get-secret-value \
            --secret-id admin-iam-arn \
            --query SecretString \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "TF_VAR_admin_iam_arn=$ADMIN_IAM_ARN" >> $GITHUB_ENV

      - name: Terraform Destroy 
        run: terraform destroy -auto-approve