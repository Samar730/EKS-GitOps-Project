name: CD - Terraform Apply infra

on: 
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Terraform Action'
        required: true
        type: choice
        options:
          - plan
          - apply

# Runner Preparations
permissions:
  id-token: write
  contents: read 

env: 
  AWS_REGION: eu-west-2

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform Plugins
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"

      - name: Checkov Scan for infra Vulnerabilities
        uses: bridgecrewio/checkov-action@v12
        with:
          soft_fail: true # Some flagged configs are intentional —> prevents pipeline being blocked by false positives
          download_external_modules: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Fmt
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate 

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        run: terraform plan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve
